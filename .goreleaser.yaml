# goreleaser configuration for npmctl.
#
# CGO is disabled for every target so the binaries are static and depend on nothing at
# runtime. go-keyring is pure Go on all three platforms, which is what makes that possible
# — it shells out to `security` on macOS, and uses syscalls elsewhere.
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: npmctl
    main: ./cmd/npmctl
    binary: npmctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # No demand for a Windows ARM64 build yet; drop it rather than ship untested.
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - docs/*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
  footer: |
    ## Safety notes

    `npmctl` manages live infrastructure. Before pointing it at production, read the
    threat model in the README: the write gate protects against accident, not against an
    attacker who already holds your credential. A dedicated, least-privilege NPM user is
    the only real boundary.

    Deleting a Let's Encrypt certificate **revokes** it. That cannot be undone.
