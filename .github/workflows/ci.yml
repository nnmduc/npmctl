name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      # Proves the release build constraint holds on every commit, not just at tag time.
      - name: Static build
        run: CGO_ENABLED=0 go build -ldflags "-s -w" -o /tmp/npmctl ./cmd/npmctl
